<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои игры — Neon Glass Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🌌 АВРОРА -->
    <div class="aurora" aria-hidden="true">
        <div class="aurora-band b1"></div>
        <div class="aurora-band b2"></div>
        <div class="aurora-band b3"></div>
    </div>

    <!-- 💡 СВЕТОВЫЕ ЛУЧИ -->
    <div class="light-beams" aria-hidden="true">
        <div class="beam beam-1"></div>
        <div class="beam beam-2"></div>
        <div class="beam beam-3"></div>
    </div>

    <!-- 🔮 ОРБЫ -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
    <div class="orb orb-5"></div>

    <!-- 🪐 ПЛАВАЮЩИЕ ФИГУРЫ -->
    <div class="floating-shapes" aria-hidden="true">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
    </div>

    <!-- 🕸️ СЕТКА -->
    <div class="grid-overlay"></div>

    <!-- ✨ ИСКРЫ -->
    <div class="sparkles" id="sparkles"></div>

    <!-- 💫 ПАДАЮЩИЕ ЗВЁЗДЫ -->
    <div class="shooting-stars" id="shootingStars"></div>

    <!-- 🎞️ CRT ЭФФЕКТЫ -->
    <div class="noise-overlay"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- 🎨 КАНВАС -->
    <canvas id="particles"></canvas>

    <!-- 🖱️ СВЕЧЕНИЕ КУРСОРА -->
    <div class="cursor-glow" id="cursorGlow"></div>

    <!-- 📦 КОНТЕЙНЕР -->
    <div class="app-container">

        <div class="header-area">
            <div>
                <h1 data-text="Мои игры">Мои игры</h1>
                <div class="subtitle">ВМС</div>
            </div>
            <button class="theme-toggle" id="themeToggle" aria-label="Сменить тему">
                <span>🎨</span>
            </button>
        </div>

        <div class="carousel-wrapper">
            <div class="arrow" id="prevBtn">&#10094;</div>
            <div class="games-container" id="gamesContainer">
                <div class="games-track" id="gamesTrack"></div>
            </div>
            <div class="arrow" id="nextBtn">&#10095;</div>
        </div>

        <div class="dots" id="dots"></div>

    </div>

    <div class="theme-modal" id="themeModal">
        <div class="theme-modal-content">
            <div class="theme-modal-header">
                <h2>Выбери тему</h2>
                <button class="close-btn" id="closeTheme">&times;</button>
            </div>
            <div class="theme-grid" id="themeGrid"></div>
        </div>
    </div>

    <script src="games.js"></script>
    <script src="themes.js"></script>
    <script>
        // ============ СЛАЙДЕР ============
        function renderGames() {
            const track = document.getElementById('gamesTrack');
            track.style.transition = 'none';
            track.style.transform = 'translateX(0)';
            track.offsetHeight;
            track.style.transition = 'transform 0.55s cubic-bezier(0.34, 1.4, 0.64, 1)';
            track.innerHTML = '';

            const isTablet = window.innerWidth <= 850;
            const itemsPerPage = isTablet ? 2 : 3;

            for (let i = 0; i < gamesData.length; i += itemsPerPage) {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'games-page';
                const chunk = gamesData.slice(i, i + itemsPerPage);

                chunk.forEach(game => {
                    const link = document.createElement('a');
                    link.href = game.link;
                    link.className = 'game-card';
                    link.target = '_blank';
                    link.innerHTML = `
                        <div class="card-glow"></div>
                        <div class="card-shine"></div>
                        <div class="card-corner tl"></div>
                        <div class="card-corner tr"></div>
                        <div class="card-corner bl"></div>
                        <div class="card-corner br"></div>
                        <img src="${game.img}" alt="${game.name}" loading="lazy"
                             onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%23111%22/><text y=%2270%22 x=%2250%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22%23888%22 font-family=%22Arial%22 font-weight=%22bold%22>?</text></svg>'">
                        <span>${game.name}</span>
                    `;
                    pageDiv.appendChild(link);
                });
                track.appendChild(pageDiv);
            }

            currentPage = 0;
            buildDots();
            updateTrackPosition();
            attachCardEffects();
        }

        let currentPage = 0;
        const track = document.getElementById('gamesTrack');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const dotsContainer = document.getElementById('dots');

        function buildDots() {
            const total = document.querySelectorAll('.games-page').length;
            dotsContainer.innerHTML = '';
            for (let i = 0; i < total; i++) {
                const d = document.createElement('div');
                d.className = 'dot';
                d.addEventListener('click', () => { currentPage = i; updateTrackPosition(); });
                dotsContainer.appendChild(d);
            }
        }

        function updateTrackPosition() {
            const total = document.querySelectorAll('.games-page').length;
            if (!total) return;
            if (currentPage < 0) currentPage = total - 1;
            if (currentPage >= total) currentPage = 0;
            track.style.transform = `translateX(-${currentPage * 100}%)`;
            dotsContainer.querySelectorAll('.dot').forEach((d, i) =>
                d.classList.toggle('active', i === currentPage));
        }

        prevBtn.addEventListener('click', () => { currentPage--; updateTrackPosition(); });
        nextBtn.addEventListener('click', () => { currentPage++; updateTrackPosition(); });

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') prevBtn.click();
            if (e.key === 'ArrowRight') nextBtn.click();
        });

        let tx0 = 0, tx1 = 0;
        const cont = document.querySelector('.games-container');
        cont.addEventListener('touchstart', e => { tx0 = e.changedTouches[0].screenX; }, {passive:true});
        cont.addEventListener('touchend', e => {
            tx1 = e.changedTouches[0].screenX;
            if (tx0 - tx1 > 50) nextBtn.click();
            if (tx1 - tx0 > 50) prevBtn.click();
        });

        let rz;
        window.addEventListener('resize', () => {
            clearTimeout(rz);
            rz = setTimeout(renderGames, 250);
        });

        // ============ TILT + RIPPLE ============
        function attachCardEffects() {
            document.querySelectorAll('.game-card').forEach(card => {
                card.addEventListener('mousemove', e => {
                    const rect = card.getBoundingClientRect();
                    const cx = rect.left + rect.width / 2;
                    const cy = rect.top + rect.height / 2;
                    const dx = (e.clientX - cx) / rect.width;
                    const dy = (e.clientY - cy) / rect.height;
                    card.style.transform = `translateY(-8px) scale(1.04) rotateX(${-dy * 8}deg) rotateY(${dx * 8}deg)`;
                });
                card.addEventListener('mouseleave', () => {
                    card.style.transform = '';
                });
                card.addEventListener('click', e => {
                    const rect = card.getBoundingClientRect();
                    const ripple = document.createElement('span');
                    ripple.className = 'ripple';
                    ripple.style.left = (e.clientX - rect.left) + 'px';
                    ripple.style.top = (e.clientY - rect.top) + 'px';
                    card.appendChild(ripple);
                    setTimeout(() => ripple.remove(), 700);
                });
            });
        }

        renderGames();

        // ============ ЧАСТИЦЫ ============
        (function() {
            const canvas = document.getElementById('particles');
            const ctx = canvas.getContext('2d');
            let W, H, particles = [];
            let colors = ['#00e5ff', '#00ffc8', '#00ff88', '#5eead4'];
            const COUNT = Math.min(85, Math.floor(window.innerWidth / 15));
            let mouse = { x: null, y: null, radius: 140 };

            window.addEventListener('mousemove', e => {
                mouse.x = e.clientX; mouse.y = e.clientY;
            });
            window.addEventListener('mouseleave', () => {
                mouse.x = null; mouse.y = null;
            });

            function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
            function rand(a, b) { return a + Math.random() * (b - a); }
            function make() {
                return {
                    x: rand(0, W), y: rand(0, H),
                    r: rand(0.8, 3.2),
                    vx: rand(-0.4, 0.4), vy: rand(-0.6, -0.1),
                    a: rand(0.4, 0.9),
                    c: colors[Math.floor(Math.random() * colors.length)],
                    p: rand(0.01, 0.03), ph: rand(0, Math.PI * 2)
                };
            }
            function init() { particles = []; for (let i = 0; i < COUNT; i++) particles.push(make()); }
            function draw() {
                ctx.clearRect(0, 0, W, H);
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const d = Math.hypot(dx, dy);
                        if (d < 120) {
                            ctx.strokeStyle = `rgba(0, 229, 255, ${(1 - d/120) * 0.18})`;
                            ctx.lineWidth = 0.8;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                }
                particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.ph += p.p;
                    if (mouse.x !== null && mouse.y !== null) {
                        const dx = p.x - mouse.x, dy = p.y - mouse.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist < mouse.radius) {
                            const angle = Math.atan2(dy, dx);
                            const force = (mouse.radius - dist) / mouse.radius;
                            p.x += Math.cos(angle) * force * 3;
                            p.y += Math.sin(angle) * force * 3;
                        }
                    }
                    if (p.x < -10) p.x = W + 10; if (p.x > W + 10) p.x = -10;
                    if (p.y < -10) { p.y = H + 10; p.x = rand(0, W); }
                    if (p.y > H + 10) { p.y = -10; p.x = rand(0, W); }
                    const g = 0.6 + Math.sin(p.ph) * 0.4;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = p.c; ctx.globalAlpha = p.a * g;
                    ctx.shadowBlur = 18; ctx.shadowColor = p.c;
                    ctx.fill(); ctx.globalAlpha = 1; ctx.shadowBlur = 0;
                });
                requestAnimationFrame(draw);
            }
            addEventListener('resize', () => { resize(); init(); });
            resize(); init(); draw();
            window.updateParticleColors = (c) => { colors = c; };
        })();

        // ============ ИСКРЫ ============
        (function() {
            const container = document.getElementById('sparkles');
            const COUNT = Math.min(60, Math.floor(window.innerWidth / 25));
            for (let i = 0; i < COUNT; i++) {
                const s = document.createElement('span');
                s.className = 'sparkle';
                s.style.left = Math.random() * 100 + '%';
                s.style.top = Math.random() * 100 + '%';
                s.style.animationDelay = (Math.random() * 6) + 's';
                s.style.animationDuration = (3 + Math.random() * 5) + 's';
                s.style.width = s.style.height = (1 + Math.random() * 3) + 'px';
                container.appendChild(s);
            }
        })();

        // ============ ЗВЁЗДЫ ============
        (function() {
            const container = document.getElementById('shootingStars');
            function spawn() {
                const s = document.createElement('span');
                s.className = 'shooting-star';
                s.style.left = Math.random() * 100 + '%';
                s.style.top = Math.random() * 40 + '%';
                s.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
                container.appendChild(s);
                setTimeout(() => s.remove(), 3000);
            }
            setInterval(spawn, 1800);
            spawn(); spawn(); spawn();
        })();

        // ============ СВЕЧЕНИЕ КУРСОРА ============
        (function() {
            const glow = document.getElementById('cursorGlow');
            let mx = 0, my = 0, gx = 0, gy = 0;
            document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
            function loop() {
                gx += (mx - gx) * 0.15;
                gy += (my - gy) * 0.15;
                glow.style.transform = `translate(${gx - 200}px, ${gy - 200}px)`;
                requestAnimationFrame(loop);
            }
            loop();
        })();

        // ============ ТЕМЫ ============
        const themeToggle = document.getElementById('themeToggle');
        const themeModal = document.getElementById('themeModal');
        const closeTheme = document.getElementById('closeTheme');
        const themeGrid = document.getElementById('themeGrid');
        const KEY = 'mygames-theme';

        function applyTheme(theme) {
            const r = document.documentElement.style;
            r.setProperty('--primary', theme.primary);
            r.setProperty('--secondary', theme.secondary);
            r.setProperty('--bg-color', theme.bg);
            r.setProperty('--card-bg', theme.cardBg);
            r.setProperty('--text-color', theme.text);

            if (window.updateParticleColors) {
                window.updateParticleColors([theme.primary, theme.secondary, theme.primary]);
            }
            document.querySelectorAll('.theme-swatch').forEach(s =>
                s.classList.toggle('active', s.dataset.name === theme.name));

            try { localStorage.setItem(KEY, theme.name); } catch(e) {}
        }

        function buildGrid() {
            themeGrid.innerHTML = '';
            themes.forEach(t => {
                const s = document.createElement('div');
                s.className = 'theme-swatch';
                s.dataset.name = t.name;
                s.style.background = `linear-gradient(135deg, ${t.primary}, ${t.secondary})`;
                s.title = t.name;
                s.addEventListener('click', () => applyTheme(t));
                themeGrid.appendChild(s);
            });
        }

        themeToggle.addEventListener('click', () => themeModal.classList.add('active'));
        closeTheme.addEventListener('click', () => themeModal.classList.remove('active'));
        themeModal.addEventListener('click', e => {
            if (e.target === themeModal) themeModal.classList.remove('active');
        });

        buildGrid();

        (function initTheme() {
            let saved = null;
            try { saved = localStorage.getItem(KEY); } catch(e) {}
            const found = saved ? themes.find(t => t.name === saved) : null;
            applyTheme(found || themes[0]);
        })();
    </script>
</body>
</html>
